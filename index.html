
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modpack Updater | AkaiZery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030303;
            --text-color: #f4f4f5;
            --text-muted: #71717a;
            --grid-color: rgba(255, 255, 255, 0.03);
            --header-bg: rgba(3, 3, 3, 0.8);
            --card-bg: rgba(24, 24, 27, 0.3);
            --border-color: rgba(255, 255, 255, 0.05);
            --input-bg: #09090b;
            --accent-glow: rgba(230, 57, 70, 0.15);
        }

        .light {
            --bg-color: #fafafa;
            --text-color: #09090b;
            --text-muted: #52525b;
            --grid-color: rgba(0, 0, 0, 0.04);
            --header-bg: rgba(250, 250, 250, 0.8);
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.08);
            --input-bg: #ffffff;
            --accent-glow: rgba(230, 57, 70, 0.1);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: #1a1a1a;
        }
        .light ::-webkit-scrollbar-thumb {
            background: #d4d4d8;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #E63946;
        }

        .nav-item-box {
            position: relative;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item-active {
            border-color: rgba(230, 57, 70, 0.3);
            background: rgba(230, 57, 70, 0.03);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .light .nav-item-active {
            background: rgba(230, 57, 70, 0.05);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "jszip": "https://esm.sh/jszip@^3.10.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
